services:
  # ── 1. FastAPI Backend Web Service ────────────────────────────────
  - type: web
    name: tracksure-backend
    runtime: docker
    dockerfilePath: Dockerfile.backend
    plan: free           # Free plan works — demo mode has no YOLO/OpenCV deps
    region: oregon
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 8000
      - key: DEMO_MODE
        value: "true"
      - key: CORS_ORIGINS
        value: "https://tracksure-frontend.onrender.com,http://localhost:3000"
      - key: WS_BROADCAST_INTERVAL_SEC
        value: "10"
      # No DATABASE_URL — running without PostgreSQL in demo mode
      # Twilio disabled — no real credentials needed for demo
      - key: TWILIO_AUTO_DISPATCH
        value: "false"
      - key: TWILIO_ACCOUNT_SID
        value: ""
      - key: TWILIO_AUTH_TOKEN
        value: ""

  # ── 2. Next.js Frontend Web Service ───────────────────────────────
  - type: web
    name: tracksure-frontend
    runtime: docker
    dockerfilePath: Dockerfile.frontend
    plan: free
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_WS_URL
        value: wss://tracksure-backend.onrender.com/ws/alerts
      - key: NEXT_PUBLIC_API_URL
        value: https://tracksure-backend.onrender.com
